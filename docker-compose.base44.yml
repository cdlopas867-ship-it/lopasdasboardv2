services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Passado pelo platform no sandbox: liga o substituto local das fotos
      # hospedadas pelo Lovable (/__l5e/assets-v1/…) em vite.config.ts.
      - BASE44_PREVIEW_MODE
      - NODE_ENV=development
      # O app assume o fuso do servidor em America/Sao_Paulo (parseModificado do
      # Drive, "hoje", semanas, selo "Atualizado"). Sem isso o container roda em
      # UTC e as datas sem hora voltam um dia ao serem exibidas no Brasil.
      - TZ=America/Sao_Paulo
    command:
      - sh
      - -ec
      - |
        npm i -g bun &&
        bun install --frozen-lockfile &&
        exec npx vite dev --port 3000 --host 0.0.0.0
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
